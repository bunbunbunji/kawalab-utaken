<!doctype html>
<html lang="ja"> <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAWAII LAB. 歌割検定 - メンテナンス中</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NEQ4WZWX9Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NEQ4WZWX9Y');

    <style>
      :root {
        --primary: #ff69b2;
        --bg: #fff0f5;
      }
      * { box-sizing: border-box; }
      @keyframes bgScroll {
        from { background-position: 0 0; }
        to   { background-position: 683px 384px; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
        color: #444;
        padding: 24px;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--bg);
        background-image: url('/maintenance-wallpaper.png');
        background-repeat: repeat;
        background-size: 683px 384px;
        animation: bgScroll 60s linear infinite;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(255, 105, 178, 0.2);
        padding: 40px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.3rem;
        color: var(--primary);
        margin: 0 0 16px;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.7;
        margin: 0 0 8px;
      }
      .sub {
        font-size: 0.85rem;
        color: #888;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="icon" src="/icon.png" alt="KAWAII LAB." />
      <h1>ただいまメンテナンス中です</h1>
      <p>より良いサービスにするため、一時的にサイトを停止しております。</p>
      <p>ご不便をおかけし申し訳ございませんが、<br>再開まで今しばらくお待ちください。</p>
      <p class="sub">KAWAII LAB. 歌割検定</p>
    </div>
  </body>
</html>
